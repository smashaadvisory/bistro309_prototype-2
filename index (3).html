/* ================= LOGIC ================= */
const norm = (s) => String(s || "").toLowerCase().trim().replace(/(es|s)$/, "");
const findItem = (name, inv) => {
  const n = norm(name); if (!n) return null;
  return inv.find((i) => { const m = norm(i.name); return m === n || (n.length > 3 && m.includes(n)) || (m.length > 3 && n.includes(m)); });
};
const recipeState = (r, inv) => {
  const missing = r.ingredients.filter((g) => { const h = findItem(g.name, inv); return !h || Number(h.qty) <= 0; }).map((g) => g.name);
  return { missing, level: missing.length === 0 ? "ready" : missing.length <= 2 ? "shop" : "ahead" };
};
const SHOP_LEAD = 120, ICED_LEAD = 120;
const MILKS = ["Whole milk", "Oat milk", "Almond milk", "Soy milk"];
const mins = (m) => (m >= 90 ? `${Math.floor(m / 60)} hr${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`);
const clock = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const styleLabel = { casual: "Casual", homey: "Homey", refined: "Refined" };
function dishExtras(it, r) {
  if (!r || !r.options || !it.opts) return { extra: 0, names: [] };
  let extra = 0; const names = [];
  r.options.forEach((grp) => {
    (it.opts[grp.id] || []).forEach((cid) => {
      const c = grp.choices.find((x) => x.id === cid);
      if (c) { extra += Number(c.extra) || 0; names.push(c.name); }
    });
  });
  return { extra, names };
}
function itemMinutes(it, data) {
  if (it.type === "dish") {
    const r = data.recipes.find((x) => x.id === it.id);
    return (r?.minutes || 0) + dishExtras(it, r).extra;
  }
  const d = data.drinks.find((x) => x.id === it.id); if (!d) return 0;
  return d.prep + (it.opts?.temp === "iced" && d.kind === "tea" ? ICED_LEAD : 0) + (it.opts?.temp === "hot" && d.kind === "cold" ? 3 : 0);
}
function cartTotals(cart, data) {
  const cookSum = cart.reduce((n, it) => n + itemMinutes(it, data), 0);
  const handling = cart.length;
  let shop = 0;
  cart.forEach((it) => {
    if (it.type !== "dish") return;
    const r = data.recipes.find((x) => x.id === it.id);
    if (r && recipeState(r, data.inventory).missing.length) shop = SHOP_LEAD;
  });
  const total = cookSum + handling + shop;
  return { cookSum, handling, shop, total, at: new Date(Date.now() + total * 60000) };
}
const describeOpts = (o, d) => {
  if (!o) return "";
  const b = [];
  if (o.temp === "iced") b.push(d?.kind === "tea" ? "iced" : "over ice");
  if (o.temp === "hot") b.push("hot");
  if (o.sweet && o.sweet !== "none") b.push(o.sweet);
  if (o.milk && o.milk !== "none") b.push(o.froth ? `${o.milk.toLowerCase()}, frothed` : o.milk.toLowerCase());
  return b.join(" · ");
};

/* ================= SOUND ================= */
function useChime() {
  const ctxRef = useRef(null);
  const unlock = useCallback(() => {
    if (!ctxRef.current) { const A = window.AudioContext || window.webkitAudioContext; if (A) ctxRef.current = new A(); }
    if (ctxRef.current && ctxRef.current.state === "suspended") ctxRef.current.resume();
  }, []);
  const strike = useCallback((base = 1046, vol = 0.22, decay = 1) => {
    unlock();
    const ctx = ctxRef.current; if (!ctx) return;
    const t = ctx.currentTime;
    const bus = ctx.createGain(); bus.gain.value = vol; bus.connect(ctx.destination);
    [[1, 1], [2.02, 0.55], [2.99, 0.34], [4.21, 0.2], [5.43, 0.12], [7.66, 0.07]].forEach(([mul, amp], i) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = "sine"; o.frequency.value = base * mul; o.detune.value = i % 2 ? 4 : -4;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay * (2.4 / (1 + i * 0.75)));
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + 3.2);
    });
    const n = ctx.createBufferSource(); const buf = ctx.createBuffer(1, 1400, ctx.sampleRate); const dat = buf.getChannelData(0);
    for (let i = 0; i < dat.length; i++) dat[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dat.length, 7);
    n.buffer = buf; const ng = ctx.createGain(); ng.gain.value = 0.1;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3200;
    n.connect(bp); bp.connect(ng); ng.connect(bus); n.start(t);
  }, [unlock]);
  const bell = useCallback(() => { strike(1046, 0.22, 1); setTimeout(() => strike(1568, 0.13, 0.8), 130); }, [strike]);
  const ping = useCallback(() => { strike(1318, 0.16, 0.7); setTimeout(() => strike(1760, 0.1, 0.55), 155); }, [strike]);
  return { bell, ping, unlock };
}

}
function Panel({ children, style, ornate }) {
  return (
    <div style={{ position: "relative", background: C.parch, border: `1px solid ${C.line}`, borderRadius: 4, padding: 6, boxShadow: "0 14px 36px rgba(70,48,42,0.14)", ...style }}>

const Divider = ({ w = 54 }) => (
  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 9, margin: "12px 0" }}>

);
const Btn = ({ children, onClick, tone = "solid", small, style, disabled }) => (
  <button onClick={disabled ? undefined : onClick} disabled={disabled} style={{
    font: `500 ${small ? 16 : 18}px ${F}`, letterSpacing: "0.02em", padding: small ? "8px 16px" : "12px 24px", borderRadius: 10,
    cursor: disabled ? "default" : "pointer", opacity: disabled ? 0.45 : 1,
    border: tone === "solid" ? `1px solid ${OUT}` : tone === "danger" ? `1px solid ${C.roseDeep}` : `1px solid ${C.line}`,
    background: tone === "solid" ? `linear-gradient(180deg,${C.tomato},${C.tomatoDeep})` : tone === "quiet" ? C.parchWell : "transparent",
    color: tone === "solid" ? "#fff" : tone === "danger" ? C.roseDeep : C.ink, ...style,
  }}>{children}</button>
);
const Chip = ({ children, onClick, active }) => (
  <button onClick={onClick} style={{
    font: `500 16px ${F}`, padding: "8px 16px", borderRadius: 999, cursor: "pointer", whiteSpace: "nowrap",
    border: `1px solid ${active ? OUT : C.line}`, background: active ? `linear-gradient(180deg,${C.sage},${C.sageDeep})` : C.parch, color: active ? "#fff" : C.soft,
  }}>{children}</button>
);
const Field = (p) => (
  <input {...p} style={{ font: `17px ${F}`, padding: "11px 14px", borderRadius: 8, border: `1px solid ${C.line}`, background: "#FFFDF8", color: C.ink, width: "100%", boxSizing: "border-box", ...p.style }} />
);
const stepBtn = { width: 32, height: 32, borderRadius: 8, border: `1px solid ${C.line}`, background: C.parch, color: C.ink, font: `500 18px ${F}`, cursor: "pointer", flexShrink: 0 };
const roundBtn = { width: 30, height: 30, borderRadius: 15, border: `1px solid ${C.line}`, background: C.parch, color: C.ink, font: `500 18px ${F}`, cursor: "pointer", display: "grid", placeItems: "center", padding: 0, lineHeight: 1 };
const Title = ({ children, size = 28 }) => <div style={{ font: `400 ${size}px/1.15 ${F}`, color: C.ink, textAlign: "center", letterSpacing: "0.01em" }}>{children}</div>;
const Sub = ({ children }) => <div style={{ font: `italic 16px/1.6 ${F}`, color: C.soft, textAlign: "center" }}>{children}</div>;
const Caps = ({ children, style }) => <div style={{ font: `500 13px ${F}`, letterSpacing: "0.16em", textTransform: "uppercase", color: C.soft, ...style }}>{children}</div>;

/* ================= APP ================= */
function App() {
  const [data, setData] = useState(null);
  const [who, setWho] = useState(null);
  const timer = useRef(null);
  const sound = useChime();

  useEffect(() => { (async () => { const raw = await store.get(); let d = null; try { d = raw ? JSON.parse(raw) : null; } catch {} setData(d || seed()); })(); }, []);

  const update = (fn) => setData((prev) => {
    const next = typeof fn === "function" ? fn(prev) : fn;
    clearTimeout(timer.current);
    timer.current = setTimeout(() => store.set(JSON.stringify(next)), 400);
    return next;
  });

  return (
    <>
      <style>{CSS}</style>
      <Backdrop />
      <div style={{ position: "relative", zIndex: 1, minHeight: 700, padding: "18px 14px 44px", fontFamily: F, color: C.ink, fontSize: 17, lineHeight: 1.5 }}>
        <div style={{ maxWidth: 560, margin: "0 auto" }}>
          {!data && <Panel><Sub>Warming the kitchen…</Sub></Panel>}
          {data && !who && <Gate data={data} onIn={(w) => { sound.unlock(); setWho(w); }} />}
          {data && who === "mayu" && <Cook data={data} update={update} setData={setData} out={() => setWho(null)} sound={sound} />}
          {data && (who === "bran" || who === "guest") && <Diner data={data} update={update} out={() => setWho(null)} mode={who} sound={sound} />}
        </div>
      </div>
    </>
  );
}

function Gate({ data, onIn }) {
  const [name, setName] = useState("mayu");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  /* clear the field the moment the page is backgrounded or loses focus */
  useEffect(() => {
    const wipe = () => setPw("");
    const onVis = () => { if (document.hidden) wipe(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("blur", wipe);
    window.addEventListener("pagehide", wipe);
    return () => { document.removeEventListener("visibilitychange", onVis); window.removeEventListener("blur", wipe); window.removeEventListener("pagehide", wipe); };
  }, []);
  const go = () => (pw === data.passwords[name] ? onIn(name) : setErr("That password doesn't open this door."));
  return (
    <div className="bb-rise">
      <div style={{ textAlign: "center", marginBottom: 6 }}><ChefBunny size={168} /></div>
      <Panel ornate>
        <Title size={36}>Bistro 309</Title>
        <Divider />
        <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap", margin: "6px 0 16px" }}>
          {[["mayu", "Mayu"], ["bran", "Bran"], ["guest", "Guest"]].map(([k, l]) => <Chip key={k} active={name === k} onClick={() => { setName(k); setErr(""); }}>{l}</Chip>)}
        </div>
        <div style={{ maxWidth: 300, margin: "0 auto", display: "grid", gap: 10 }}>
          <Field type="password" inputMode="text" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
            placeholder="Password" value={pw}
            onChange={(e) => { setPw(e.target.value); setErr(""); }}
            onKeyDown={(e) => e.key === "Enter" && go()}
            style={{ WebkitTextSecurity: "disc", textSecurity: "disc" }} />
          <Btn onClick={go}>Log in</Btn>
          {err && <div style={{ font: `16px ${F}`, color: C.tomato, textAlign: "center" }}>{err}</div>}
        </div>
      </Panel>
    </div>
  );
}

function Bar({ label, out }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
      <div style={{ width: 54, flexShrink: 0 }}><ChefBunny size={54} /></div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ font: `400 22px/1.1 ${F}`, color: C.ink }}>Bistro 309</div>
        <Caps>{label}</Caps>
      </div>
      <Btn small tone="ghost" onClick={out}>Log out</Btn>
    </div>
  );
}

/* ================= COOK ================= */
function Cook({ data, update, setData, out, sound }) {
  const [section, setSection] = useState("orders");
  const [cooking, setCooking] = useState(null);
  const [note, setNote] = useState(null);
  const seen = useRef(new Set(data.requests.map((r) => r.id)));
  const seenCravings = useRef(new Set(data.cravings.map((c) => c.id)));
  const openCount = data.requests.filter((r) => !r.done).length + data.cravings.filter((c) => !c.done).length;

  useEffect(() => {
    let alive = true;
    const iv = setInterval(async () => {
      try {
        const raw = await store.get(); if (!raw || !alive) return;
        const remote = JSON.parse(raw);
        const fresh = (remote.requests || []).filter((r) => !seen.current.has(r.id));
        const freshCr = (remote.cravings || []).filter((c) => !seenCravings.current.has(c.id));
        if (!fresh.length && !freshCr.length) return;
        fresh.forEach((r) => seen.current.add(r.id)); freshCr.forEach((c) => seenCravings.current.add(c.id));
        setData((p) => ({ ...p, requests: remote.requests, cravings: remote.cravings, history: remote.history }));
        const first = fresh[0];
        const label = first ? (first.recipeId ? remote.recipes.find((x) => x.id === first.recipeId)?.name : remote.drinks.find((x) => x.id === first.drinkId)?.name) : `Craving: ${freshCr[0].text}`;
        setNote({ who: first ? (first.from === "guest" ? `Guest${first.guestName ? " · " + first.guestName : ""}` : "Bran") : "Bran", body: fresh.length > 1 ? `${label} and ${fresh.length - 1} more` : label, when: first?.whenLabel || "" });
        sound.ping();
        setTimeout(() => setNote(null), 5400);
      } catch {}
    }, 6000);
    return () => { alive = false; clearInterval(iv); };
  }, []);

  const titles = { freezer: "Freezer", fridge: "Fridge & Pantry", orders: "Mailbox", recipes: "Recipe Book", cellar: "Cellar & Bar", week: "This Week" };
  return (
    <div>
      {note && (
        <div className="bb-drop" style={{ position: "fixed", top: 12, left: 12, right: 12, zIndex: 90, maxWidth: 532, margin: "0 auto", background: "#FFFCF6", border: `1px solid ${C.gold}`, borderRadius: 16, padding: "12px 14px", display: "flex", gap: 11, alignItems: "center", boxShadow: "0 12px 30px rgba(70,48,42,0.26)" }}>
          <div style={{ width: 40, height: 40, borderRadius: 10, background: C.blush, display: "grid", placeItems: "center", overflow: "hidden", flexShrink: 0 }}><ChefBunny size={44} still /></div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ font: `500 17px ${F}`, color: C.ink }}>New from {note.who}</div>
            <div style={{ font: `15px ${F}`, color: C.soft, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{note.body}{note.when ? ` — ${note.when}` : ""}</div>
          </div>
          <Btn small tone="ghost" onClick={() => { setNote(null); setSection("orders"); }}>Open</Btn>
        </div>
      )}
      <Bar label="Kitchen" out={out} />
      <Fridge active={section} onPick={setSection} counts={{ orders: openCount }} />
      <Sub>Tap a door or magnet</Sub>
      <Panel style={{ marginTop: 14 }}>
        <Title size={26}>{titles[section]}</Title>
        <Divider w={40} />
        {section === "freezer" && <Stores data={data} update={update} locs={["freezer"]} />}
        {section === "fridge" && <Stores data={data} update={update} locs={["fridge", "pantry"]} />}
        {section === "orders" && <Post data={data} update={update} />}
        {section === "recipes" && <Book data={data} update={update} cook={setCooking} />}
        {section === "cellar" && <Cellar data={data} update={update} />}
        {section === "week" && <Week data={data} update={update} />}
      </Panel>
      {cooking && <CookMode recipe={cooking} close={() => setCooking(null)} />}
    </div>
  );
}

function Stores({ data, update, locs }) {
  const [adding, setAdding] = useState(null);
  const [editing, setEditing] = useState(null);
  const setQty = (id, d) => update((p) => ({ ...p, inventory: p.inventory.map((i) => i.id === id ? { ...i, qty: Math.max(0, Number(i.qty) + d) } : i) }));
  const remove = (id) => update((p) => ({ ...p, inventory: p.inventory.filter((i) => i.id !== id) }));
  const soon = data.inventory.filter((i) => locs.includes(i.loc) && i.fresh <= 2);
  return (
    <div>
      {soon.length > 0 && <div style={{ background: C.goldLt, borderRadius: 8, padding: "10px 14px", marginBottom: 14, font: `16px/1.5 ${F}` }}><span style={{ fontStyle: "italic" }}>Use today:</span> {soon.map((i) => i.name).join(", ")}</div>}
      {locs.map((loc) => (
        <div key={loc} style={{ marginBottom: 18 }}>
          {locs.length > 1 && <Caps style={{ marginBottom: 8 }}>{loc}</Caps>}
          <div style={{ display: "grid", gap: 10 }}>
            {data.inventory.filter((i) => i.loc === loc).map((i) => (
              <div key={i.id} style={{ borderBottom: `1px solid ${C.hair}`, paddingBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ font: `500 18px ${F}` }}>{i.name}</div>
                    <div style={{ font: `15px ${F}`, color: i.fresh <= 2 ? C.tomato : C.soft }}>{i.fresh <= 2 ? "Use today" : `${i.fresh} days left`}</div>
                  </div>
                  <button onClick={() => setQty(i.id, -1)} style={stepBtn}>–</button>
                  <div style={{ font: `500 15px ${F}`, minWidth: 62, textAlign: "center" }}>{i.qty} {i.unit}</div>
                  <button onClick={() => setQty(i.id, 1)} style={stepBtn}>+</button>
                  <button onClick={() => setEditing(editing === i.id ? null : i.id)} style={{ ...stepBtn, color: C.soft, font: `italic 15px ${F}` }}>✎</button>
                  <button onClick={() => remove(i.id)} style={{ ...stepBtn, color: C.soft }}>×</button>
                </div>
                {i.reheat && editing !== i.id && <div style={{ font: `italic 15px/1.5 ${F}`, color: C.soft, marginTop: 6 }}>{i.reheat}</div>}
                {editing === i.id && <ItemForm loc={loc} initial={i} onDone={(item) => { update((p) => ({ ...p, inventory: p.inventory.map((x) => x.id === i.id ? { ...x, ...item, id: i.id } : x) })); setEditing(null); }} cancel={() => setEditing(null)} />}
              </div>
            ))}
          </div>
          {adding === loc ? <ItemForm loc={loc} onDone={(item) => { update((p) => ({ ...p, inventory: [...p.inventory, item] })); setAdding(null); }} cancel={() => setAdding(null)} /> : <Btn small tone="quiet" onClick={() => setAdding(loc)} style={{ marginTop: 12 }}>Add to {loc}</Btn>}
        </div>
      ))}
    </div>
  );
}

function ItemForm({ loc, onDone, cancel, initial }) {
  const [f, setF] = useState(initial ? { name: initial.name, qty: initial.qty, unit: initial.unit, cat: initial.cat, fresh: initial.fresh, reheat: initial.reheat || "" } : { name: "", qty: 1, unit: "ea", cat: "produce", fresh: 7, reheat: "" });
  const set = (k, v) => setF({ ...f, [k]: v });
  return (
    <div style={{ display: "grid", gap: 10, background: C.parchWell, padding: 14, borderRadius: 10, marginTop: 12 }}>
      <Field placeholder="Name" value={f.name} onChange={(e) => set("name", e.target.value)} />
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <Field type="number" value={f.qty} onChange={(e) => set("qty", e.target.value)} style={{ width: 74 }} />
        <Field placeholder="unit" value={f.unit} onChange={(e) => set("unit", e.target.value)} style={{ width: 84 }} />
        <Field type="number" value={f.fresh} onChange={(e) => set("fresh", e.target.value)} style={{ width: 74 }} />
        <span style={{ font: `15px ${F}`, color: C.soft }}>days</span>
      </div>
      <select value={f.cat} onChange={(e) => set("cat", e.target.value)} style={{ font: `17px ${F}`, padding: 11, borderRadius: 8, border: `1px solid ${C.line}`, background: "#FFFDF8", color: C.ink }}>
        {["produce", "dairy", "meat", "grain", "spice", "sauce", "frozen", "premade", "homemade"].map((c) => <option key={c}>{c}</option>)}
      </select>
      {loc === "freezer" && <Field placeholder="Reheating instructions" value={f.reheat} onChange={(e) => set("reheat", e.target.value)} />}
      <div style={{ display: "flex", gap: 8 }}>
        <Btn small onClick={() => f.name.trim() && onDone({ ...f, id: initial ? initial.id : uid(), loc, qty: Number(f.qty), fresh: Number(f.fresh) })}>{initial ? "Save" : "Add"}</Btn>
        <Btn small tone="ghost" onClick={cancel}>Cancel</Btn>
      </div>
    </div>
  );
}

function Post({ data, update }) {
  const [copied, setCopied] = useState(false);
  const open = data.requests.filter((r) => !r.done);
  const cravings = data.cravings.filter((c) => !c.done);
  const rec = (id) => data.recipes.find((r) => r.id === id);
  const dr = (id) => data.drinks.find((d) => d.id === id);
  const from = (r) => (r.from === "guest" ? `Guest${r.guestName ? " · " + r.guestName : ""}` : "Bran");
  const line = (r) => (r.recipeId ? rec(r.recipeId)?.name : dr(r.drinkId)?.name);
  const shopping = useMemo(() => { const s = new Set(); open.forEach((r) => { const R = r.recipeId && rec(r.recipeId); if (R) recipeState(R, data.inventory).missing.forEach((m) => s.add(m)); }); return [...s]; }, [data.requests, data.inventory]);
  const summary = () => open.map((r) => `· ${from(r)}: ${line(r)}${r.custom ? ` (${r.custom})` : ""} — ${r.whenLabel}`).join("\n") + (shopping.length ? `\n\nShopping: ${shopping.join(", ")}` : "") + (cravings.length ? `\n\nCravings:\n${cravings.map((c) => "· " + c.text).join("\n")}` : "");

  if (!open.length && !cravings.length) return <div style={{ textAlign: "center" }}><Mailbox size={150} /><Sub>No orders yet.</Sub></div>;
  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 12 }}><Mailbox size={140} count={open.length + cravings.length} /></div>
      {shopping.length > 0 && (
        <div style={{ background: C.blush, borderRadius: 8, padding: "12px 14px", marginBottom: 14 }}>
          <Caps style={{ color: C.roseDeep, marginBottom: 2 }}>To buy</Caps>
          <div style={{ font: `17px/1.5 ${F}` }}>{shopping.join(", ")}</div>
        </div>
      )}
      <div style={{ display: "grid", gap: 10, marginBottom: 14 }}>
        {open.map((r) => (
          <div key={r.id} className="bb-rise" style={{ background: r.from === "guest" ? C.blush : C.parchWell, borderRadius: 10, padding: 13, display: "flex", gap: 10, alignItems: "center" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ font: `500 18px ${F}` }}>{line(r)}</div>
              {r.custom && <div style={{ font: `italic 15px ${F}`, color: C.roseDeep }}>{r.custom}</div>}
              <div style={{ font: `15px ${F}`, color: C.soft }}>{from(r)} · {r.whenLabel}{r.note ? ` · ${r.note}` : ""}</div>
            </div>
            <Btn small tone="ghost" onClick={() => update((p) => ({ ...p, requests: p.requests.map((x) => x.id === r.id ? { ...x, done: true } : x) }))}>Done</Btn>
          </div>
        ))}
      </div>
      {cravings.length > 0 && (<>
        <Caps style={{ marginBottom: 8 }}>Cravings</Caps>
        <div style={{ display: "grid", gap: 10, marginBottom: 14 }}>
          {cravings.map((c) => (
            <div key={c.id} style={{ background: C.parchWell, border: `1px dashed ${C.roseDeep}`, borderRadius: 10, padding: 13, display: "flex", gap: 10 }}>
              <div style={{ flex: 1, font: `italic 17px/1.5 ${F}` }}>{c.text}</div>
              <Btn small tone="ghost" onClick={() => update((p) => ({ ...p, cravings: p.cravings.map((x) => x.id === c.id ? { ...x, done: true } : x) }))}>Clear</Btn>
            </div>
          ))}
        </div>
      </>)}
      <Btn small tone="quiet" onClick={() => { navigator.clipboard?.writeText(summary()); setCopied(true); setTimeout(() => setCopied(false), 1600); }}>{copied ? "Copied" : "Copy orders"}</Btn>
    </div>
  );
}

function Book({ data, update, cook }) {
  const [openId, setOpenId] = useState(null);
  const [writing, setWriting] = useState(false);
  const [filter, setFilter] = useState("all");
  const [confirmId, setConfirmId] = useState(null);
  const [editId, setEditId] = useState(null);
  const list = data.recipes.filter((r) => filter === "all" || (filter === "guest" ? r.guest : r.style === filter));
  const del = (id) => { update((p) => ({ ...p, recipes: p.recipes.filter((x) => x.id !== id), menu: p.menu.filter((m) => m !== id) })); setConfirmId(null); setOpenId(null); };
  return (
    <div>
      <div className="bb-scroll" style={{ display: "flex", gap: 7, overflowX: "auto", paddingBottom: 14 }}>
        {[["all", "All"], ["guest", "Guest menu"], ["refined", "Refined"], ["homey", "Homey"], ["casual", "Casual"]].map(([k, l]) => <Chip key={k} active={filter === k} onClick={() => setFilter(k)}>{l}</Chip>)}
      </div>
      {writing ? <RecipeForm onSave={(r) => { update((p) => ({ ...p, recipes: [...p.recipes, r] })); setWriting(false); }} cancel={() => setWriting(false)} /> : <Btn small tone="quiet" onClick={() => setWriting(true)} style={{ marginBottom: 14 }}>New recipe</Btn>}
      <div style={{ display: "grid", gap: 10 }}>
        {list.map((r) => {
          const st = recipeState(r, data.inventory);
          const isOpen = openId === r.id;
          const pairs = data.drinks.filter((d) => d.pairs.includes(r.id));
          return (
            <div key={r.id} style={{ border: `1px solid ${C.hair}`, borderRadius: 10, background: C.parchWell, overflow: "hidden" }}>
              <button onClick={() => { setOpenId(isOpen ? null : r.id); setConfirmId(null); }} style={{ width: "100%", textAlign: "left", padding: 14, background: "transparent", border: "none", cursor: "pointer", color: C.ink }}>
                <div style={{ font: `500 19px ${F}` }}>{r.name}</div>
                <div style={{ font: `15px ${F}`, color: C.soft, marginTop: 2 }}>{styleLabel[r.style]} · {mins(r.minutes)}{st.missing.length ? ` · missing ${st.missing.length}` : ""}</div>
              </button>
              {isOpen && editId === r.id && (
                <div style={{ padding: "0 14px 14px" }}>
                  <RecipeForm initial={r} onSave={(nr) => { update((p) => ({ ...p, recipes: p.recipes.map((x) => x.id === r.id ? nr : x) })); setEditId(null); }} cancel={() => setEditId(null)} />
                </div>
              )}
              {isOpen && editId !== r.id && (
                <div style={{ padding: "0 14px 14px" }}>
                  <div style={{ font: `17px/1.75 ${F}`, marginBottom: 10 }}>
                    {r.ingredients.map((i, n) => { const have = !!findItem(i.name, data.inventory); return <div key={n} style={{ color: have ? C.ink : C.tomato }}>{i.qty ? i.qty + " " : ""}{i.name}{have ? "" : " — to buy"}</div>; })}
                  </div>
                  {r.options && r.options.length > 0 && (
                    <div style={{ marginBottom: 10 }}>
                      {r.options.map((grp) => (
                        <div key={grp.id} style={{ font: `16px/1.6 ${F}`, color: C.soft }}>
                          <span style={{ color: C.ink }}>{grp.label}:</span> {grp.choices.map((c) => c.name).join(", ")}
                        </div>
                      ))}
                    </div>
                  )}
                  {pairs.length > 0 && <div style={{ font: `italic 16px ${F}`, color: C.roseDeep, marginBottom: 10 }}>Pairs: {pairs.map((p) => p.name).join(", ")}</div>}
                  {r.notes && <div style={{ font: `italic 16px/1.6 ${F}`, color: C.soft, marginBottom: 10 }}>{r.notes}</div>}
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <Btn small onClick={() => cook(r)}>Cook</Btn>
                    <Btn small tone="ghost" onClick={() => setEditId(r.id)}>Edit</Btn>
                    <Btn small tone="ghost" onClick={() => update((p) => ({ ...p, recipes: p.recipes.map((x) => x.id === r.id ? { ...x, guest: !x.guest } : x) }))}>{r.guest ? "Hide from guests" : "Show to guests"}</Btn>
                    {confirmId === r.id ? <Btn small tone="danger" onClick={() => del(r.id)}>Confirm delete</Btn> : <Btn small tone="ghost" onClick={() => setConfirmId(r.id)} style={{ color: C.soft }}>Delete</Btn>}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

  } : { name: "", blurb: "", style: "homey", minutes: 30, course: "main", guest: false, ing: "", steps: "", notes: "" });
  const [opts, setOpts] = useState(initial && initial.options ? JSON.parse(JSON.stringify(initial.options)) : []);
  const addGroup = () => setOpts([...opts, { id: uid(), label: "", multi: false, required: false, choices: [{ id: uid(), name: "", extra: 0 }] }]);
  const setGroup = (gi, patch) => setOpts(opts.map((g, i) => (i === gi ? { ...g, ...patch } : g)));
  const setChoice = (gi, ci, patch) => setOpts(opts.map((g, i) => (i === gi ? { ...g, choices: g.choices.map((c, j) => (j === ci ? { ...c, ...patch } : c)) } : g)));
  const addChoice = (gi) => setOpts(opts.map((g, i) => (i === gi ? { ...g, choices: [...g.choices, { id: uid(), name: "", extra: 0 }] } : g)));
  const delChoice = (gi, ci) => setOpts(opts.map((g, i) => (i === gi ? { ...g, choices: g.choices.filter((_, j) => j !== ci) } : g)));
  const delGroup = (gi) => setOpts(opts.filter((_, i) => i !== gi));
  const set = (k, v) => setF({ ...f, [k]: v });
  const ta = { font: `17px/1.6 ${F}`, padding: 12, borderRadius: 8, border: `1px solid ${C.line}`, background: "#FFFDF8", color: C.ink, width: "100%", boxSizing: "border-box", minHeight: 88 };
  return (
    <div style={{ background: C.parchWell, borderRadius: 10, padding: 14, marginBottom: 14, display: "grid", gap: 10 }}>
      <Field placeholder="Dish name" value={f.name} onChange={(e) => set("name", e.target.value)} />
      <Field placeholder="Short description" value={f.blurb} onChange={(e) => set("blurb", e.target.value)} />
      <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
        {["casual", "homey", "refined"].map((s) => <Chip key={s} active={f.style === s} onClick={() => set("style", s)}>{styleLabel[s]}</Chip>)}
        {["main", "dessert", "side"].map((s) => <Chip key={s} active={f.course === s} onClick={() => set("course", s)}>{s}</Chip>)}
        <Field type="number" value={f.minutes} onChange={(e) => set("minutes", e.target.value)} style={{ width: 78 }} />
      </div>
      <Chip active={f.guest} onClick={() => set("guest", !f.guest)}>{f.guest ? "On guest menu" : "Household only"}</Chip>
      <textarea style={ta} placeholder={"Ingredients, one per line\n4 duck legs\n300ml red wine"} value={f.ing} onChange={(e) => set("ing", e.target.value)} />
      <textarea style={ta} placeholder="Steps, one per line" value={f.steps} onChange={(e) => set("steps", e.target.value)} />
      <Field placeholder="Cook's note (optional)" value={f.notes} onChange={(e) => set("notes", e.target.value)} />

      <div style={{ borderTop: `1px solid ${C.line}`, paddingTop: 12 }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
          <Caps>Variants</Caps>
          <span style={{ font: `italic 14px ${F}`, color: C.soft }}>fillings, toppings, sides</span>
        </div>
        {opts.length === 0 && <div style={{ font: `italic 15px/1.5 ${F}`, color: C.soft, margin: "6px 0 10px" }}>None. Add a group like "Filling" or "On top" and list what can be chosen.</div>}
        {opts.map((grp, gi) => (
          <div key={grp.id} style={{ background: "#FFFDF8", border: `1px solid ${C.hair}`, borderRadius: 8, padding: 12, marginTop: 10, display: "grid", gap: 8 }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <Field placeholder="Group name, e.g. Filling" value={grp.label} onChange={(e) => setGroup(gi, { label: e.target.value })} />
              <button onClick={() => delGroup(gi)} style={{ ...stepBtn, color: C.soft }}>×</button>
            </div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              <Chip active={grp.multi} onClick={() => setGroup(gi, { multi: !grp.multi })}>{grp.multi ? "Choose any number" : "Choose one"}</Chip>
              <Chip active={grp.required} onClick={() => setGroup(gi, { required: !grp.required })}>{grp.required ? "Required" : "Optional"}</Chip>
            </div>
            {grp.choices.map((c, ci) => (
              <div key={c.id} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <Field placeholder="Choice" value={c.name} onChange={(e) => setChoice(gi, ci, { name: e.target.value })} />
                <Field type="number" placeholder="0" value={c.extra} onChange={(e) => setChoice(gi, ci, { extra: e.target.value })} style={{ width: 70 }} />
                <span style={{ font: `14px ${F}`, color: C.soft, whiteSpace: "nowrap" }}>+min</span>
                <button onClick={() => delChoice(gi, ci)} style={{ ...stepBtn, color: C.soft }}>×</button>
              </div>
            ))}
            <Btn small tone="ghost" onClick={() => addChoice(gi)}>Add a choice</Btn>
          </div>
        ))}
        <Btn small tone="quiet" onClick={addGroup} style={{ marginTop: 10 }}>Add a variant group</Btn>
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        <Btn small onClick={() => {
          if (!f.name.trim()) return;
          const ingredients = f.ing.split("\n").filter((l) => l.trim()).map((l) => { const m = l.trim().match(/^([\d./]+\s*[a-zA-Z]*\.?)\s+(.*)$/); return m ? { qty: m[1], name: m[2] } : { qty: "", name: l.trim() }; });
          const options = opts
            .map((g) => ({ ...g, label: g.label.trim(), choices: g.choices.filter((c) => c.name.trim()).map((c) => ({ ...c, name: c.name.trim(), extra: Number(c.extra) || 0 })) }))
            .filter((g) => g.label && g.choices.length);
          onSave({ id: initial ? initial.id : uid(), name: f.name.trim(), blurb: f.blurb, style: f.style, course: f.course, guest: f.guest, minutes: Number(f.minutes) || 30, ingredients, steps: f.steps.split("\n").filter((l) => l.trim()), notes: f.notes, options });
        }}>Save</Btn>
        <Btn small tone="ghost" onClick={cancel}>Cancel</Btn>
      </div>
    </div>
  );
}

function CookMode({ recipe, close }) {
  const [i, setI] = useState(0);
  const last = i >= recipe.steps.length - 1;
  return (
    <div style={{ position: "fixed", inset: 0, background: `linear-gradient(180deg, ${C.bg}, ${C.bgDeep})`, padding: 24, zIndex: 95, display: "flex", flexDirection: "column", fontFamily: F }}>
      <div style={{ display: "flex", alignItems: "center", marginBottom: 10 }}>
        <div style={{ flex: 1, font: `400 27px ${F}`, color: C.ink }}>{recipe.name}</div>
        <Btn small tone="ghost" onClick={close}>Done</Btn>
      </div>
      <Caps>Step {i + 1} of {recipe.steps.length}</Caps>
      <div style={{ flex: 1, font: `400 26px/1.55 ${F}`, marginTop: 20, color: C.ink }}>{recipe.steps[i]}</div>
      <div style={{ display: "flex", gap: 10 }}>
        <Btn tone="ghost" onClick={() => setI(Math.max(0, i - 1))} style={{ flex: 1 }}>Back</Btn>
        <Btn onClick={() => (last ? close() : setI(i + 1))} style={{ flex: 2 }}>{last ? "Plate it" : "Next"}</Btn>
      </div>
    </div>
  );
}

    <div>
      {kinds.map(([k, label]) => (
        <div key={k} style={{ marginBottom: 18 }}>

            {data.drinks.filter((d) => d.kind === k).map((d) => (
              <div key={d.id} style={{ borderBottom: `1px solid ${C.hair}`, paddingBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

                    <div style={{ font: `500 18px ${F}`, color: d.stock === 0 ? C.soft : C.ink }}>{d.name}{d.stock === 0 && " · out"}</div>
                    <div style={{ font: `italic 15px/1.5 ${F}`, color: C.soft }}>{d.note}</div>
                  </div>

                  <button onClick={() => { setEditing(editing === d.id ? null : d.id); setAdding(false); }} style={{ ...stepBtn, color: C.soft, font: `italic 15px ${F}` }}>✎</button>

      ) : <Btn small tone="quiet" onClick={() => { setAdding(true); setEditing(null); }}>Add a drink</Btn>}

  );
}

  const groups = (guest
    ? [
        { key: "plates", title: "Plates", list: dishes.filter((r) => r.course !== "dessert") },
        { key: "sweet", title: "Sweet", list: dishes.filter((r) => r.course === "dessert") },
      ]
    : [
        { key: "ready", title: "Ready now", note: "Everything is in the kitchen", list: dishes.filter((r) => r.level === "ready") },
        { key: "shop", title: "After a quick shop", note: "Two hours' notice", list: dishes.filter((r) => r.level === "shop") },
        { key: "ahead", title: "Ask ahead", note: "Choose a day when you order", list: dishes.filter((r) => r.level === "ahead") },
      ]).filter((g) => g.list.length);
  const drinkGroups = [["cold", "Cold"], ["tea", "Tea & Coffee"], ["wine", "Wine"], ["cocktail", "Cocktails"]];

  const suggested = useMemo(() => { const s = new Set(); cart.filter((c) => c.type === "dish").forEach((c) => data.drinks.forEach((d) => d.pairs.includes(c.id) && s.add(d.id))); return s; }, [cart, data.drinks]);
  const count = (type, id) => cart.filter((c) => c.type === type && c.id === id).length;
  const removeOne = (type, id) => { const idx = cart.map((c, i) => (c.type === type && c.id === id ? i : -1)).filter((i) => i >= 0).pop(); if (idx === undefined) return; setCart(cart.filter((_, i) => i !== idx)); };
  const addDish = (r) => {
    if (r.options && r.options.length) { setDishOpt({ recipe: r, opts: {} }); return; }
    setCart([...cart, { key: uid(), type: "dish", id: r.id }]);
  };
  const addDrink = (d) => {
    if (!(d.iceable || d.hotable || d.sweeten || d.milkable)) { setCart([...cart, { key: uid(), type: "drink", id: d.id, opts: {} }]); return; }
    setCustomizing({ drink: d, opts: { temp: "none", sweet: "none", milk: d.defaultMilk || "none", froth: false } });
  };
  const sendCraving = () => {
    if (!craving.trim()) return;
    update((p) => ({ ...p, cravings: [...p.cravings, { id: uid(), text: craving.trim(), done: false }] }));
    sound.ping(); setCraving(""); setCravingSent(true); setTimeout(() => setCravingSent(false), 2400);
  };

  if (sent) return <Sent sent={sent} onAgain={() => { setSent(null); setCart([]); }} />;

  const Row = ({ name, desc, time, tag, tagTone, n, onAdd, onRemove }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 0", borderBottom: `1px solid ${C.hair}` }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
          <span style={{ font: `400 21px/1.25 ${F}`, color: C.ink }}>{name}</span>
          {tag && <span style={{ font: `500 12px ${F}`, letterSpacing: "0.12em", textTransform: "uppercase", color: tagTone === "gold" ? "#7A5A12" : C.roseDeep }}>{tag}</span>}
        </div>
        {desc && <div style={{ font: `italic 16px/1.45 ${F}`, color: C.soft, marginTop: 1 }}>{desc}</div>}
        <div style={{ font: `14px ${F}`, color: C.soft, marginTop: 4, letterSpacing: "0.04em" }}>{time}</div>
      </div>
      {n > 0 ? (
        <div style={{ display: "flex", alignItems: "center", gap: 6, background: C.parchWell, border: `1px solid ${C.line}`, borderRadius: 999, padding: 3 }}>
          <button onClick={onRemove} style={roundBtn}>–</button>
          <span style={{ font: `500 16px ${F}`, minWidth: 14, textAlign: "center" }}>{n}</span>
          <button onClick={onAdd} style={{ ...roundBtn, background: C.tomato, color: "#fff", borderColor: C.tomato }}>+</button>
        </div>
      ) : <button onClick={onAdd} style={{ ...roundBtn, width: 36, height: 36, borderRadius: 18, background: C.tomato, color: "#fff", borderColor: C.tomato, fontSize: 22 }}>+</button>}
    </div>
  );
  const Head = ({ title, note }) => (
    <div style={{ marginTop: 28, marginBottom: 2, display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10 }}>
      <div style={{ font: `400 23px/1.2 ${F}`, color: C.ink }}>{title}</div>
      {note && <div style={{ font: `italic 15px ${F}`, color: C.soft }}>{note}</div>}
    </div>
  );

  return (
    <div style={{ paddingBottom: cart.length ? 96 : 0 }}>
      <Bar label={guest ? "Guest" : "Bran"} out={out} />
      <Panel ornate>
        <Caps style={{ textAlign: "center" }}>{new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</Caps>
        <Title size={34}>Menu</Title>
        <Divider />
        {freshest.length > 0 && <Sub>Freshest today — {freshest.join(", ")}</Sub>}

        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginTop: 14 }}>
          <Chip active={tab === "food"} onClick={() => setTab("food")}>Food</Chip>
          <Chip active={tab === "drink"} onClick={() => setTab("drink")}>Drinks</Chip>
        </div>

        {tab === "food" && groups.map((g) => (
          <div key={g.key}>
            <Head title={g.title} note={g.note} />
            {g.list.map((r) => (
              <Row key={r.id} name={r.name} desc={r.blurb}
                tag={guest ? null : r.onMenu ? "This week" : r.level === "shop" ? `Needs ${r.missing.join(", ")}` : null} tagTone={r.onMenu ? "gold" : "rose"}
                time={`${mins(r.minutes)}${r.options && r.options.length ? " · choices" : ""}`} n={count("dish", r.id)} onAdd={() => addDish(r)} onRemove={() => removeOne("dish", r.id)} />
            ))}
          </div>
        ))}

        {tab === "food" && !guest && (
          <div style={{ marginTop: 30, background: C.parchWell, borderRadius: 10, padding: 16 }}>
            <div style={{ font: `400 22px ${F}`, marginBottom: 4 }}>Craving something else?</div>
            <div style={{ font: `italic 15px ${F}`, color: C.soft, marginBottom: 10 }}>Tell Mayu what you're in the mood for.</div>
            <div style={{ display: "flex", gap: 8 }}>
              <Field placeholder="Something sour. Noodles. Soup." value={craving} onChange={(e) => setCraving(e.target.value)} onKeyDown={(e) => e.key === "Enter" && sendCraving()} />
              <Btn small onClick={sendCraving} disabled={!craving.trim()}>{cravingSent ? "Sent" : "Send"}</Btn>
            </div>
          </div>
        )}

        {tab === "drink" && drinkGroups.map(([k, label]) => {
          const list = data.drinks.filter((d) => d.kind === k && d.stock > 0);
          if (!list.length) return null;
          return (
            <div key={k}>
              <Head title={label} />
              {list.map((d) => (
                <Row key={d.id} name={d.name} desc={d.note} tag={suggested.has(d.id) ? "Pairs with your food" : null} tagTone="gold"
                  time={mins(d.prep)} n={count("drink", d.id)} onAdd={() => addDrink(d)} onRemove={() => removeOne("drink", d.id)} />
              ))}
            </div>
          );
        })}
      </Panel>

      {cart.length > 0 && (
        <div style={{ position: "sticky", bottom: 10, marginTop: 18, zIndex: 20 }}>
          <button onClick={() => setReviewing(true)} style={{ width: "100%", background: `linear-gradient(180deg,${C.tomato},${C.tomatoDeep})`, color: "#fff", border: `1px solid ${OUT}`, borderRadius: 12, padding: "14px 18px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12, boxShadow: "0 10px 24px rgba(70,48,42,0.28)" }}>
            <div style={{ width: 28, height: 28, borderRadius: 14, background: "rgba(255,255,255,0.24)", display: "grid", placeItems: "center", font: `500 15px ${F}` }}>{cart.length}</div>
            <div style={{ flex: 1, textAlign: "left", font: `500 18px ${F}`, letterSpacing: "0.02em" }}>Review order</div>
            <div style={{ font: `italic 16px ${F}`, color: C.goldLt }}>about {mins(cartTotals(cart, data).total)}</div>
          </button>
        </div>
      )}

      {dishOpt && <DishOptions state={dishOpt} close={() => setDishOpt(null)} add={(opts) => { setCart([...cart, { key: uid(), type: "dish", id: dishOpt.recipe.id, opts }]); setDishOpt(null); }} />}
      {customizing && <Customize state={customizing} data={data} close={() => setCustomizing(null)} add={(opts) => { setCart([...cart, { key: uid(), type: "drink", id: customizing.drink.id, opts }]); setCustomizing(null); }} />}
      {reviewing && <Review cart={cart} data={data} mode={mode} guest={guest} sound={sound} close={() => setReviewing(false)} removeAt={(k) => setCart(cart.filter((c) => c.key !== k))} onSend={(p) => { update(p.apply); setReviewing(false); setSent(p.receipt); }} />}
    </div>
  );
}

function DishOptions({ state, close, add }) {
  const r = state.recipe;
  const [sel, setSel] = useState(state.opts || {});
  const toggle = (grp, cid) => {
    const cur = sel[grp.id] || [];
    if (grp.multi) setSel({ ...sel, [grp.id]: cur.includes(cid) ? cur.filter((x) => x !== cid) : [...cur, cid] });
    else setSel({ ...sel, [grp.id]: cur.includes(cid) ? [] : [cid] });
  };
  const missing = (r.options || []).filter((grp) => grp.required && !(sel[grp.id] || []).length);
  let extra = 0;
  (r.options || []).forEach((grp) => (sel[grp.id] || []).forEach((cid) => { const c = grp.choices.find((x) => x.id === cid); if (c) extra += Number(c.extra) || 0; }));
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(70,48,42,0.4)", zIndex: 92, display: "flex", alignItems: "flex-end", backdropFilter: "blur(3px)", fontFamily: F }} onClick={close}>
      <div onClick={(e) => e.stopPropagation()} className="bb-rise" style={{ background: C.parch, width: "100%", maxHeight: "88%", overflowY: "auto", borderRadius: "18px 18px 0 0", padding: "18px 20px 26px", borderTop: `2px solid ${C.gold}` }}>
        <div style={{ width: 42, height: 4, borderRadius: 2, background: C.line, margin: "0 auto 14px" }} />
        <Title size={26}>{r.name}</Title>
        {r.blurb && <Sub>{r.blurb}</Sub>}
        {(r.options || []).map((grp) => (
          <div key={grp.id}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", margin: "20px 0 8px" }}>
              <Caps>{grp.label}</Caps>
              <span style={{ font: `italic 14px ${F}`, color: C.soft }}>{grp.required ? "choose one" : grp.multi ? "any number" : "optional"}</span>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {grp.choices.map((c) => (
                <Chip key={c.id} active={(sel[grp.id] || []).includes(c.id)} onClick={() => toggle(grp, c.id)}>
                  {c.name}{Number(c.extra) ? ` +${c.extra}m` : ""}
                </Chip>
              ))}
            </div>
          </div>
        ))}
        <div style={{ marginTop: 24, display: "flex", gap: 10, alignItems: "center" }}>
          <div style={{ flex: 1, font: `italic 16px ${F}`, color: C.soft }}>About {mins(r.minutes + extra)}</div>
          <Btn tone="ghost" small onClick={close}>Cancel</Btn>
          <Btn onClick={() => add(sel)} disabled={missing.length > 0}>Add</Btn>
        </div>
      </div>
    </div>
  );
}

function Customize({ state, data, close, add }) {
  const d = state.drink;
  const [o, setO] = useState(state.opts);
  const set = (k, v) => setO({ ...o, [k]: v });
  const milkStock = (m) => { const h = findItem(m, data.inventory); return h && Number(h.qty) > 0; };
  const iced = o.temp === "iced", hot = o.temp === "hot";
  const icedTea = iced && d.kind === "tea";
  const Label = ({ children }) => <Caps style={{ margin: "20px 0 8px" }}>{children}</Caps>;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(70,48,42,0.4)", zIndex: 92, display: "flex", alignItems: "flex-end", backdropFilter: "blur(3px)", fontFamily: F }} onClick={close}>
      <div onClick={(e) => e.stopPropagation()} className="bb-rise" style={{ background: C.parch, width: "100%", maxHeight: "88%", overflowY: "auto", borderRadius: "18px 18px 0 0", padding: "18px 20px 26px", borderTop: `2px solid ${C.gold}` }}>
        <div style={{ width: 42, height: 4, borderRadius: 2, background: C.line, margin: "0 auto 14px" }} />
        <Title size={26}>{d.name}</Title>
        <Sub>{d.note}</Sub>

        {(d.iceable || d.hotable) && (<>
          <Label>Add-ons</Label>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {d.iceable && <Chip active={iced} onClick={() => set("temp", iced ? "none" : "iced")}>{d.kind === "tea" ? "Iced" : "Over ice"}</Chip>}
            {d.hotable && <Chip active={hot} onClick={() => set("temp", hot ? "none" : "hot")}>Hot</Chip>}
          </div>
          {icedTea && <div style={{ font: `italic 15px/1.5 ${F}`, color: C.tomato, marginTop: 8 }}>Iced tea is brewed and chilled ahead — allow two hours.</div>}
        </>)}

        {d.sweeten && (<>
          <Label>Sweetener</Label>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {["none", "sugar", "maple syrup"].map((s) => <Chip key={s} active={o.sweet === s} onClick={() => set("sweet", s)}>{s === "none" ? "None" : s[0].toUpperCase() + s.slice(1)}</Chip>)}
          </div>
        </>)}

        {d.milkable && (<>
          <Label>Milk</Label>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <Chip active={o.milk === "none"} onClick={() => set("milk", "none")}>None</Chip>
            {MILKS.map((m) => { const have = milkStock(m); return (
              <button key={m} onClick={() => have && set("milk", m)} disabled={!have} style={{ font: `500 16px ${F}`, padding: "8px 16px", borderRadius: 999, whiteSpace: "nowrap", cursor: have ? "pointer" : "default", border: `1px solid ${o.milk === m ? OUT : C.line}`, background: o.milk === m ? C.sageDeep : C.parch, color: o.milk === m ? "#fff" : have ? C.soft : "#C4B5A4", textDecoration: have ? "none" : "line-through" }}>{m}{have ? "" : " · out"}</button>
            ); })}
          </div>
          {o.milk !== "none" && <div style={{ marginTop: 10 }}><Chip active={o.froth} onClick={() => set("froth", !o.froth)}>{o.froth ? "Frothed" : "Froth it"}</Chip></div>}
        </>)}

        <div style={{ marginTop: 24, display: "flex", gap: 10, alignItems: "center" }}>
          <div style={{ flex: 1, font: `italic 16px ${F}`, color: C.soft }}>About {mins(d.prep + (icedTea ? ICED_LEAD : 0) + (hot && d.kind === "cold" ? 3 : 0))}</div>
          <Btn tone="ghost" small onClick={close}>Cancel</Btn>
          <Btn onClick={() => add(o)}>Add</Btn>
        </div>
      </div>
    </div>
  );
}

function Review({ cart, data, mode, guest, close, removeAt, onSend, sound }) {
  const [timing, setTiming] = useState("asap");
  const [when, setWhen] = useState("");
  const [name, setName] = useState("");
  const [note, setNote] = useState("");
  const t = cartTotals(cart, data);
  const whenLabel = timing === "asap" ? `as soon as possible, about ${clock(t.at)}` : timing === "later" ? `later today${when ? `, ${when}` : ""}` : `another day${when ? `, ${when}` : ""}`;
  const label = (it) => it.type === "dish" ? data.recipes.find((r) => r.id === it.id)?.name : data.drinks.find((d) => d.id === it.id)?.name;
  const sub = (it) => it.type === "dish"
    ? dishExtras(it, data.recipes.find((r) => r.id === it.id)).names.join(" · ")
    : describeOpts(it.opts, data.drinks.find((d) => d.id === it.id));
  const send = () => {
    sound.bell();
    const batch = { id: uid(), from: mode, when: new Date().toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }), items: cart.map(({ type, id, opts }) => ({ type, id, opts })) };
    setTimeout(() => onSend({
      apply: (p) => ({
        ...p, history: [...(p.history || []), batch],
        requests: [...p.requests, ...cart.map((it) => ({ id: uid(), from: mode, guestName: name.trim(), recipeId: it.type === "dish" ? it.id : undefined, drinkId: it.type === "drink" ? it.id : undefined, custom: sub(it), whenLabel, note: note.trim(), done: false }))],
      }),
      receipt: { count: cart.length, whenLabel, shop: t.shop > 0 && !guest, total: t.total, name: name.trim() },
    }), 950);
  };
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(70,48,42,0.4)", zIndex: 92, display: "flex", alignItems: "flex-end", backdropFilter: "blur(3px)", fontFamily: F }} onClick={close}>
      <div onClick={(e) => e.stopPropagation()} className="bb-rise" style={{ background: C.parch, width: "100%", maxHeight: "93%", overflowY: "auto", borderRadius: "18px 18px 0 0", padding: "18px 20px 28px", borderTop: `2px solid ${C.gold}` }}>
        <div style={{ width: 42, height: 4, borderRadius: 2, background: C.line, margin: "0 auto 14px" }} />
        <Title size={28}>Your Order</Title>
        <Divider w={36} />
        <div style={{ display: "grid", gap: 10 }}>
          {cart.map((it) => (
            <div key={it.key} style={{ display: "flex", gap: 10, alignItems: "center", background: C.parchWell, borderRadius: 10, padding: 13 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ font: `500 18px ${F}` }}>{label(it)}</div>
                {sub(it) && <div style={{ font: `italic 15px ${F}`, color: C.roseDeep }}>{sub(it)}</div>}
                <div style={{ font: `15px ${F}`, color: C.soft }}>{mins(itemMinutes(it, data))}</div>
              </div>
              <button onClick={() => removeAt(it.key)} style={{ ...stepBtn, color: C.soft }}>×</button>
            </div>
          ))}
        </div>
        <div style={{ background: C.parchWell, borderRadius: 10, padding: 14, marginTop: 14 }}>
          {[["Cooking", mins(t.cookSum)], ["Plating", mins(t.handling)]].concat(t.shop && !guest ? [["Shopping first", mins(t.shop)]] : []).map(([k, v]) => (
            <div key={k} style={{ display: "flex", justifyContent: "space-between", font: `16px ${F}`, color: C.soft, marginBottom: 6 }}><span>{k}</span><span>{v}</span></div>
          ))}
          <div style={{ borderTop: `1px solid ${C.line}`, marginTop: 8, paddingTop: 10, display: "flex", justifyContent: "space-between", font: `500 19px ${F}` }}><span>Estimated total</span><span>{mins(t.total)}</span></div>
          {timing === "asap" && <div style={{ font: `italic 16px ${F}`, color: C.soft, marginTop: 6 }}>Ready around {clock(t.at)}</div>}
        </div>
        <Caps style={{ margin: "20px 0 8px" }}>When</Caps>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {[["asap", "As soon as possible"], ["later", "Later today"], ["day", "Another day"]].map(([k, l]) => <Chip key={k} active={timing === k} onClick={() => setTiming(k)}>{l}</Chip>)}
        </div>
        {timing !== "asap" && <div style={{ marginTop: 10 }}><Field placeholder={timing === "later" ? "What time?" : "Which day and time?"} value={when} onChange={(e) => setWhen(e.target.value)} /></div>}
        <div style={{ marginTop: 16, display: "grid", gap: 10 }}>
          {guest && <Field placeholder="Your name" value={name} onChange={(e) => setName(e.target.value)} />}
          <Field placeholder={guest ? "Allergies or preferences" : "A note for the kitchen"} value={note} onChange={(e) => setNote(e.target.value)} />
        </div>
        <div style={{ marginTop: 22 }}><ServiceBell onRing={send} label="Ring for service" /></div>
      </div>
    </div>
  );
}

function Sent({ sent, onAgain }) {
  return (
    <div className="bb-rise" style={{ paddingTop: 22 }}>
      <Panel ornate>
        <div style={{ textAlign: "center" }}><BirdPost size={280} /></div>
        <Divider />
        <Title size={28}>It's on its way{sent.name ? `, ${sent.name}` : ""}</Title>
        <p style={{ font: `17px/1.7 ${F}`, color: C.soft, maxWidth: 360, margin: "10px auto 0", textAlign: "center" }}>
          {sent.count} {sent.count === 1 ? "item" : "items"} sent to the kitchen, {sent.whenLabel}. About {mins(sent.total)}.{sent.shop ? " Includes a shopping run." : ""}
        </p>
        <div style={{ textAlign: "center", marginTop: 20 }}><Btn tone="quiet" onClick={onAgain}>Order something else</Btn></div>
      </Panel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
